<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="страница регистрации">
    <title>рецептуар - регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex align-items-center justify-content-center flex-column mb-3" style="height: 100vh;">
    <div class="card text-center mb-3" style="width: 25rem; height: 25rem; background-color:darksalmon; padding: 5%; justify-content: center;">
        <form id="signUpForm" style="color: white;">
        <div class="mb-3">
            <label for="inputName" class="form-label">ваше имя</label>
            <input type="text" class="form-control" id="inputName" required>
        </div>
        <div class="mb-3">
            <label for="inputEmail2" class="form-label">электронная почта</label>
            <input type="email" class="form-control" id="inputEmail2" required>
        </div>
        <div class="mb-3">
            <label for="inputPassword21" class="form-label">пароль</label>
            <input type="password" class="form-control" id="inputPassword21" required>
        </div>
        <div class="mb-3">
            <label for="inputPassword22" class="form-label">пароль еще раз</label>
            <input type="password" class="form-control" id="inputPassword22" required>
        </div>
        <button type="submit" class="btn btn-primary">регистрация</button>
        </form>
    </div>
    <a href="index.html" class="btn btn-primary">назад</a>
    </div>
</body>
<script>
    document.getElementById('signUpForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const name = document.getElementById('inputName').value.trim();
    const email = document.getElementById('inputEmail2').value.trim();
    const password = document.getElementById('inputPassword21').value;
    const confirmPassword = document.getElementById('inputPassword22').value;

    if (password !== confirmPassword) {
        alert('пароли не совпадают');
        return;
    }

    const users = JSON.parse(localStorage.getItem('users')) || [];
    const user = users.find(u => u.email === email);
    
    if (user) {
        alert('Пользователь с такой почтой уже зарегистрирован')
    } else {
        let newUser = {name: name,
                        email: email,
                        password: password,
                        favourites: [],
                        recipes: [] };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify(newUser));
        setTimeout(() => {
            window.location.href = 'main_page.html';
        }, 1000);
    }    
    })
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
