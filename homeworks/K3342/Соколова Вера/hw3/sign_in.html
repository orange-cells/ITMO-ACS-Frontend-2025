<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="страница входа">
    <title>рецептуар - вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>
<header>
    <div class="container-fluid" style="background-color: #e9967a; padding-top: 10px;">
        <div class="d-flex align-items-center" style="justify-content: flex-end;">
            <button id="themeToggle" class="btn btn-outline-secondary btn-sm" title="переключить тему">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>
</header>
<body>
    <div class="d-flex align-items-center justify-content-center flex-column mb-3" style="height: 100vh;">
    <div class="card text-center mb-3" style="width: 25rem; height: 25rem; background-color:darksalmon; padding: 5%; justify-content: center;">
        <form id="signInForm" style="color: white;">
        <div class="mb-3">
            <label for="inputEmail1" class="form-label">электронная почта</label>
            <input type="email" class="form-control" id="inputEmail1" aria-describedby="emailHelp" required>
        </div>
        <div class="mb-3">
            <label for="inputPassword1" class="form-label">пароль</label>
            <input type="password" class="form-control" id="inputPassword1" required>
        </div>
        <button type="submit" class="btn btn-primary">вход</button>
        </form>
    </div>
    <a href="index.html" class="btn btn-primary">назад</a>
    </div>
</body>
<script>
    document.getElementById('signInForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const email = document.getElementById('inputEmail1').value.trim();
    const password = document.getElementById('inputPassword1').value;

    const users = JSON.parse(localStorage.getItem('users')) || [];
    const user = users.find(u => u.email === email);
    
    if (user) {
        if (password == user.password) {
            setTimeout(() => {
                window.location.href = 'main_page.html';
                localStorage.setItem('currentUser', JSON.stringify(user));
            }, 1000);
        } else {
            alert('Пароль введен неправильно');
        }
    } else {
        alert('Такого пользователя не существует :(');  
    }
    });

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const htmlElement = document.documentElement;

    const applyTheme = (theme) => {
        htmlElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);
        themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    };

    // Загружаем сохраненную тему
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
        const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
    });

</script>
</html>
