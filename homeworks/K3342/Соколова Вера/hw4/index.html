<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="начальная страница сайта">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>рецептуар</title>
</head>
<header>
    <div class="container-fluid" style="background-color: #e9967a; padding-top: 10px;">
        <div class="d-flex align-items-center" style="justify-content: flex-end;">
            <button id="themeToggle" class="btn btn-outline-secondary">
                <svg class="icon" id="themeIconSvg">
                    <use href="images\sprite.svg#icon-moon"></use>
                </svg>
            </button>
        </div>
    </div>
</header>
<body>
    <div class="d-flex align-items-center justify-content-center flex-column mb-3" style="height: 100vh;">
    <div class="card text-center mb-3" style="width: 25rem; height: 25rem; background-color:darksalmon;">
        <div class="card-body" style="display: flex; flex-direction: column; align-items: center;  justify-content: center; color: white">
            <h3 class="card-title">РЕЦЕПТУАР</h3>
            <p>удобный поиск рецептов</p>
            <a href="sign_in.html" class="btn btn-primary" style="width:fit-content; color: white; background-color:rgb(244, 103, 56); border: none">вход</a>
            <p></p>
            <a href="sign_up.html" class="btn btn-primary;" style="width:fit-content; color: white; background-color:rgb(244, 103, 56); border: none">регистрация</a>
        </div>
    </div>
    </div>
</body>
<script>
    const themeToggle = document.getElementById('themeToggle');
        const themeIconUse = document.querySelector('#themeIconSvg use');
        const htmlElement = document.documentElement;

        const applyTheme = (theme) => {
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'dark') {
                themeIconUse.setAttribute('href', 'images/sprite.svg#icon-sun');
            } else {
                themeIconUse.setAttribute('href', 'images/sprite.svg#icon-moon');
            }
        };

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(newTheme);
            });
        }

</script>
</html>
