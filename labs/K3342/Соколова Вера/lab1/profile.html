<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>личный кабинет - рецептуар</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="main_page.html" style="background-color: salmon; padding: 10px; color: white;border-radius: 50%;">рецептуар</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">выйти</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="profile.html">личный кабинет</a>
                </li>
            </ul>
        </div>
        </nav>
    </header>

    <main>
      <div class="container-ingr" style="display: flex; flex-wrap: wrap; padding: 5%; gap: 20px;">
            <img src="images/image.png" style="width: 200px; border-radius: 50%;">
            <div class="card-body">
                <ul class="list-group" style="flex-direction: column;">
                    <li class="list-group-item" id="name">имя: </li>
                    <li class="list-group-item" id="email">email: </li>
                </ul>
            </div>
        </div>

        <ul class="nav nav-tabs justify-content-center" id="profileTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="saved-tab" data-bs-toggle="tab" data-bs-target="#saved" type="button" role="tab">
              сохраненные
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="my-recipes-tab" data-bs-toggle="tab" data-bs-target="#my-recipes" type="button" role="tab">
              мои рецепты
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="subscription-tab" data-bs-toggle="tab" data-bs-target="#subscription" type="button" role="tab">
              подписки
            </button>
          </li>
        </ul>

        <div class="tab-content mt-4 container" id="profileTabsContent">
            
            <div class="tab-pane fade show active" id="saved" role="tabpanel">
                <h4 class="text-center mb-4">ваши любимые рецепты</h4>
                <div id="savedRecipesContainer" class="row g-4">
                  <!--вставить через жс-->
                </div>
            </div>

            <div class="tab-pane fade" id="my-recipes" role="tabpanel">
                <div class="text-center p-5">
                    <h3 class="text-muted">позже</h3>
                    <p>этот раздел находится в разработке</p>
                </div>
            </div>

            <div class="tab-pane fade" id="subscription" role="tabpanel">
                <div class="text-center p-5">
                    <h3 class="text-muted">позже</h3>
                    <p>этот раздел находится в разработке</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentUser = JSON.parse(localStorage.getItem('currentUser'));

            const nameDisplay = document.getElementById("name");
            const emailInput = document.getElementById("email");

            if (nameDisplay) {
              nameDisplay.textContent = "имя: " + currentUser.name; 
            }
            if (emailInput) {
              emailInput.textContent = "email: " + currentUser.email;
            }

            const savedContainer = document.getElementById('savedRecipesContainer');
            const likedRecipes = currentUser.favourites || [];
            const recipes = JSON.parse(localStorage.getItem('existingRecipes'));

            if (likedRecipes.length === 0) {
                savedContainer.innerHTML = '<div class="text-center"><p>вы еще ничего не сохранили</p></div>';
            } else {
                likedRecipes.forEach(id => {
                    const rec = recipes.filter(rec => rec.recId === id)[0];
                    console.log(rec)
                    savedContainer.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">${rec.name}</h5>
                                    <a href="${rec.link}" class="btn btn-primary mt-auto">открыть рецепт</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
