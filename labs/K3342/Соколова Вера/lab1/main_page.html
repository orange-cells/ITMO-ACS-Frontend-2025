<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>рецептуар</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="main_page.html" style="background-color: salmon; padding: 10px; color: white;border-radius: 50%;">рецептуар</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">личный кабинет</a>
                </li>
            </ul>
        </div>
        </nav>
    </header>

    <main>
        <div class="d-flex align-items-center justify-content-center flex-column mb-3" style="height: 100vh;">
        <div class="card text-center mb-3" style="width: 80%; height: 30rem; background-color:darksalmon; padding: 5%; justify-content: center;">
        <form>
        <fieldset>
            <legend>фильтры</legend>

            <div class="mb-3">
            <label for="selectDishType" class="form-label">тип блюда</label>
            <select id="selectDishType" class="form-select">
                <option>суп</option>
                <option>второе</option>
                <option>десерт</option>
            </select>
            </div>

            <div class="mb-3">
            <label for="selectComplexity" class="form-label">сложность</label>
            <select id="selectComplexity" class="form-select">
                <option>сложно</option>
                <option>надо постараться</option>
                <option>легко</option>
            </select>
            </div>
            
            <p>ингредиенты</p>
            <ul class="list-group", style="flex-wrap: wrap;">
            <li class="list-group-item">
                <input class="form-check-input me-1" type="checkbox" value="" id="firstCheckbox">
                <label class="form-check-label" for="firstCheckbox">морковь</label>
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="checkbox" value="" id="secondCheckbox">
                <label class="form-check-label" for="secondCheckbox">молоко</label>
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="checkbox" value="" id="thirdCheckbox">
                <label class="form-check-label" for="thirdCheckbox">рис</label>
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="checkbox" value="" id="forthCheckbox">
                <label class="form-check-label" for="forthCheckbox">лук</label>
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="checkbox" value="" id="fifthCheckbox">
                <label class="form-check-label" for="fifthCheckbox">яйца</label>
            </li>
            </ul>

            <p></p>
            <button type="submit" class="btn btn-primary">поиск</button>
        </fieldset>
        </form>
        </div>
        </div>

        <div class="catalog" style="padding: 10px;">
            <h1>рецепты</h1>
            <div class="items-list">
                <div class="card" id="rec1" style="width: 18rem;">
                <img src="images/beer_soup.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">пивной суп</h5>
                    <p class="card-text">прикольно с сухариками</p>
                    <a href="beer_soup.html" class="btn btn-primary">рецепт</a>
                </div>
                </div>

                <div class="card" id="rec2" style="width: 18rem;">
                <img src="images/fried_rice.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">жареный рис</h5>
                    <p class="card-text">вкусно и сытно</p>
                    <a href="fried_rice.html" class="btn btn-primary">рецепт</a>
                </div>
                </div>

                <div class="card" id="rec3" style="width: 18rem;">
                <img src="images/cake.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">торт "Карпатка"</h5>
                    <p class="card-text">много крема и глазури</p>
                    <a href="cake.html" class="btn btn-primary">рецепт</a>
                </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
