<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="основная страница сайта">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>рецептуар</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="main_page.html" style="background-color: salmon; padding: 10px; color: white;border-radius: 50%;">рецептуар</a>
            <div class="d-flex align-items-center">
                <ul class="navbar-nav me-3">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="profile.html">личный кабинет</a>
                    </li>
                </ul>
                <button id="themeToggle" class="btn btn-outline-secondary btn-sm" title="переключить тему">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
        </nav>
    </header>

    <main>
        <div class="d-flex align-items-center justify-content-center flex-column mb-3" style="height: 100vh;">
        <div class="card text-center mb-3 filter-card" style="width: 80%; height: 30rem; background-color:darksalmon; padding: 5%; justify-content: center;">
        <form>
        <fieldset>
            <legend>фильтры</legend>

            <div class="mb-3">
            <label for="selectDishType" class="form-label">тип блюда</label>
            <select id="selectDishType" class="form-select">
                <option>любой</option>
                <option>суп</option>
                <option>второе</option>
                <option>десерт</option>
            </select>
            </div>

            <div class="mb-3">
            <label for="selectComplexity" class="form-label">сложность</label>
            <select id="selectComplexity" class="form-select">
                <option>любая</option>
                <option>сложно</option>
                <option>надо постараться</option>
                <option>легко</option>
            </select>
            </div>
            
            <p>поиск по названию</p>
            <input type="text" id="searchInput" class="form-control" placeholder="пишите сюда">
            <p></p>
            <button type="submit" class="btn btn-primary">поиск</button>
        </fieldset>
        </form>
        </div>
        </div>

        <div class="catalog" style="padding: 10px;">
            <h1>рецепты</h1>
            <div class="items-list" id="catalog-container"></div>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        const filterForm = document.querySelector('form');
        const recipeCards = document.querySelectorAll('.catalog .card');

        filterForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const dishType = document.getElementById('selectDishType').value.toLowerCase();
            const dishComplexity = document.getElementById('selectComplexity').value.toLowerCase();
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

            recipeCards.forEach(card => {
                const cardType = card.getAttribute('dish-type').toLowerCase();
                const cardComplexity = card.getAttribute('dish-complexity').toLowerCase();
                const cardTitle = card.querySelector('.card-title').textContent.toLowerCase();

                const matchesType = (dishType === 'любой' || cardType === dishType);
                const matchesComplexity = (dishComplexity === 'любая' || cardComplexity === complexityValue);
                const matchesSearch = cardTitle.includes(searchText);

                if (matchesType && matchesComplexity && matchesSearch) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        async function loadCatalog() {
            const container = document.getElementById('catalog-container');
            const recipes = await api.getRecipes();

            container.innerHTML = recipes.map(recipe => `
                <div class="card" dish-type="${recipe.type}" dish-complexity="${recipe.complexity}" style="width: 18rem;">
                    <img src="${recipe.image}" class="card-img-top" alt="изображение для рецепта">
                    <div class="card-body">
                        <h2 class="card-title">${recipe.title}</h2>
                        <p class="card-text">${recipe.description}</p>
                        <a href="${recipe.link}" class="btn btn-primary">рецепт</a>
                    </div>
                </div>
            `).join('');
        }
        loadCatalog();

        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        const applyTheme = (theme) => {
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        };

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(newTheme);
            });
        }


    </script>
</body>
</html>
